<!doctype html><!-- Copyright 2026 上海如静知华信息科技有限公司 --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知华 CronOps</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4f1;color:#302b27;font:14px "PingFang SC",sans-serif}header{height:64px;padding:0 5vw;display:flex;align-items:center;gap:18px;background:#352f2a;color:#fff}header a{margin-left:auto;color:#e8bd79}main{max-width:980px;margin:34px auto;padding:0 18px}.card{background:white;border:1px solid #e2ddd6;border-radius:10px;padding:26px}input{width:100%;font:22px monospace;padding:15px;border:1px solid #d5cec5;border-radius:6px}button{margin-top:16px;background:#b66b27;color:white;border:0;border-radius:6px;padding:11px 22px}.result{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.result div{padding:18px;background:#faf5ef;border-radius:7px}pre{white-space:pre-wrap}@media(max-width:640px){.result{grid-template-columns:1fr}}</style><header><b>ZhuaTech CronOps</b><span>任务计划分析</span><a href="https://www.zhuatech.cn/">知华科技</a></header><main><div class="card"><h2>Cron 表达式</h2><input id="cron" value="*/15 * * * *"><button id="run">分析执行计划</button><div class="result"><div id="valid">等待</div><div id="runs">每日次数</div><div id="risk">风险状态</div></div><pre id="notes"></pre></div></main><script>run.onclick=async()=>{try{const r=await fetch('http://localhost:8083/api/cronops/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expression:cron.value,averageRunMinutes:1,maxConcurrency:2,idempotent:true,failureAlertEnabled:true})}).then(x=>x.json());valid.textContent=r.valid?'表达式有效':'表达式无效';runs.textContent=r.estimatedRunsPerDay+' 次/日';risk.textContent=r.status;notes.textContent=r.warnings.join('\n')}catch(e){notes.textContent='请启动后端服务'}};</script>
